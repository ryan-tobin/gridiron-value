[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gridiron-value"
version = "0.2.0"
description = "Reproducible research into NFL offensive production"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "nflreadpy",
    "numpy",
    "polars",
    "scipy>=1.15",
    "scikit-learn>=1.2",
    "matplotlib",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "ruff",
    "ipykernel",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 88